name: kinya_learn
description: A Flutter app for learning Kinyarwanda language.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.1.0
  provider: ^6.0.5
  url_launcher: ^6.2.4
  video_player: ^2.8.1
  audioplayers: ^5.2.1
  shared_preferences: ^2.2.2
  webview_flutter: ^4.4.4
  flutter_inappwebview: ^6.0.0
  flutter_tts: ^3.8.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/images/greetings/
    - assets/audio/
    - assets/audio/kinyarwanda/

# Enable platforms
platforms:
  android:
  ios:
  web:
  windows:
  macos:
  linux:
