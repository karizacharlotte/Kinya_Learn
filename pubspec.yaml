name: kinya_learn
description: A Flutter app for learning Kinyarwanda language.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  youtube_player_flutter: ^9.1.1
  provider: ^6.0.5
  webview_flutter: ^4.7.0
  url_launcher: ^6.2.5
  video_player: ^2.8.6
  chewie: ^1.7.5
  audioplayers: ^6.0.0
  flutter_tts: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

# Enable platforms
platforms:
  android:
  ios:
  web:
  windows:
  macos:
  linux:
