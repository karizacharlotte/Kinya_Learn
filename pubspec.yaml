name: kinya_learn
description: A Flutter app for learning Kinyarwanda language.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.1.0
  provider: ^6.0.5
  url_launcher: ^6.2.4
  video_player: ^2.8.1
  audioplayers: ^6.5.0
  shared_preferences: ^2.2.2
  webview_flutter: ^4.4.4
  flutter_inappwebview: ^6.0.0
  firebase_core: ^3.15.1
  firebase_auth: ^5.6.2
  cloud_firestore: ^5.6.11
  firebase_storage: ^12.4.9
  flutter_local_notifications: ^19.3.1
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/images/greetings/

# Enable platforms
platforms:
  android:
  ios:
  web:
  windows:
  macos:
  linux:
